version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      pmd:
        patterns: ["net.sourceforge.pmd:*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
