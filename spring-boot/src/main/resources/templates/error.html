<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${status} ${error}|">Error</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
            background: #f8fafc;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        h1 {
            font-size: 72px;
            color: #2563eb;
        }

        p {
            color: #64748b;
            margin: 8px 0 32px;
            font-size: 18px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>
<body>
<main>
    <h1 th:text="${status}">500</h1>
    <p th:text="${error}">Something went wrong.</p>
    <a href="/">Back to home</a>
</main>
</body>
</html>
