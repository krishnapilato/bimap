#
# BiMap IAM Service
#
# Every secret is read from the environment. Nothing sensitive is committed; the defaults here
# are safe placeholders for a local run and are overridden in every real deployment.
#

# ---------------------------------------------------------------------------
# Local secrets
#
# Reads the .env at the repository root, so one file serves Docker and a local run alike.
# Optional and searched from three depths, because the working directory differs between
# running from the repo root, from backend/, and from the module directory in an IDE.
# Real environment variables always win over anything found here.
# ---------------------------------------------------------------------------
spring.config.import = optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.application.name           = bimap-iam-service
server.port                       = ${IAM_SERVER_PORT:9843}
server.shutdown                   = graceful
server.compression.enabled        = true
server.compression.mime-types     = application/json,application/problem+json,text/html,text/css,application/javascript
server.error.include-message      = always
server.error.include-stacktrace   = never
server.error.whitelabel.enabled   = false

spring.threads.virtual.enabled    = true
spring.mvc.problemdetails.enabled = true
spring.lifecycle.timeout-per-shutdown-phase = 20s
spring.jackson.default-property-inclusion   = non_null
# Jackson 3 already writes temporals as ISO-8601 strings, so nothing to configure here.

# ---------------------------------------------------------------------------
# Landing page and CORS
# ---------------------------------------------------------------------------
bimap.platform.service-name    = IAM Service
bimap.platform.tagline         = Identity, access and transactional email for BiMap
bimap.platform.app-url         = ${BIMAP_APP_URL:http://localhost:4200}
bimap.platform.repository-url  = https://github.com/krishnapilato/bimap
bimap.platform.cors-origins    = ${BIMAP_CORS_ORIGINS:http://localhost:4200}

# The sibling service, linked from the landing page so its API is one click away rather than a
# port number an operator has to remember.
bimap.platform.peers[0].name = Business Core
bimap.platform.peers[0].url  = ${BUSINESS_SERVICE_URL:http://localhost:9844}
bimap.platform.peers[0].owns = Asset registrations, Italian geography, address and code lookups

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
spring.datasource.url          = jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bimap_iam}?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username     = ${DB_USERNAME:bimap}
spring.datasource.password     = ${DB_PASSWORD:}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name          = bimap-iam-pool
spring.datasource.hikari.maximum-pool-size  = ${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle       = 2
spring.datasource.hikari.connection-timeout = 20000
spring.datasource.hikari.max-lifetime       = 1200000

# The schema is owned by Flyway; Hibernate only checks that the mapping still matches it.
spring.jpa.hibernate.ddl-auto              = validate
spring.jpa.open-in-view                    = false
spring.jpa.properties.hibernate.jdbc.batch_size        = 50
spring.jpa.properties.hibernate.order_inserts          = true
spring.jpa.properties.hibernate.order_updates          = true
spring.jpa.properties.hibernate.jdbc.time_zone         = UTC
spring.jpa.properties.hibernate.query.in_clause_parameter_padding = true

spring.flyway.enabled           = true
spring.flyway.locations         = classpath:db/migration
spring.flyway.baseline-on-migrate = true

# ---------------------------------------------------------------------------
# Tokens
# ---------------------------------------------------------------------------
bimap.security.jwt.secret                   = ${BIMAP_JWT_SECRET:development-only-secret-please-replace-me-in-every-real-deployment}
bimap.security.jwt.issuer                   = ${BIMAP_JWT_ISSUER:bimap}
bimap.security.jwt.access-token-ttl         = ${BIMAP_ACCESS_TOKEN_TTL:15m}
bimap.security.jwt.refresh-token-ttl        = ${BIMAP_REFRESH_TOKEN_TTL:30d}
bimap.security.jwt.activation-token-ttl     = 48h
bimap.security.jwt.password-reset-token-ttl = 1h

# ---------------------------------------------------------------------------
# Authentication policy
# ---------------------------------------------------------------------------
bimap.auth.max-failed-login-attempts = ${BIMAP_MAX_LOGIN_ATTEMPTS:5}
bimap.auth.lockout-duration          = ${BIMAP_LOCKOUT_DURATION:15m}
bimap.auth.self-registration-enabled = ${BIMAP_SELF_REGISTRATION:true}
bimap.auth.google-client-id          = ${GOOGLE_CLIENT_ID:}
bimap.auth.stale-activation-after    = 7d

# ---------------------------------------------------------------------------
# Seed accounts (idempotent, see seed/users.json)
# ---------------------------------------------------------------------------
bimap.seed.enabled  = ${BIMAP_SEED_ENABLED:true}
bimap.seed.location = classpath:seed/users.json
# Leave empty in production: accounts are then created pending activation and each person
# chooses their own password from the emailed link.
bimap.seed.password = ${BIMAP_SEED_PASSWORD:}

# ---------------------------------------------------------------------------
# Mail
# ---------------------------------------------------------------------------
spring.mail.host      = ${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port      = ${MAIL_PORT:587}
spring.mail.username  = ${MAIL_USERNAME:}
spring.mail.password  = ${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth                = true
spring.mail.properties.mail.smtp.starttls.enable     = true
spring.mail.properties.mail.smtp.connectiontimeout   = 5000
spring.mail.properties.mail.smtp.timeout             = 5000
spring.mail.properties.mail.smtp.writetimeout        = 5000

bimap.mail.from         = ${MAIL_FROM:no-reply@bimap.local}
bimap.mail.from-name    = ${MAIL_FROM_NAME:BiMap}
bimap.mail.app-base-url = ${BIMAP_APP_URL:http://localhost:4200}
bimap.mail.enabled      = ${MAIL_ENABLED:true}


# Authentication is stateless and token-based, so the default in-memory user (and the generated
# password it prints at every start) is dead weight.
spring.autoconfigure.exclude = org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Readiness decides whether a load balancer sends traffic here. The database belongs in that
# decision; a temporarily unreachable SMTP relay does not, because the API still works without it.
management.endpoint.health.group.readiness.include = readinessState,db
management.endpoint.health.group.liveness.include  = livenessState

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include = health,info,metrics,loggers,env,mappings
management.endpoint.health.show-details   = when_authorized
management.endpoint.health.probes.enabled = true
management.observations.key-values.service = bimap-iam-service
management.metrics.distribution.percentiles-histogram.http.server.requests = true

springdoc.api-docs.path        = /v3/api-docs
springdoc.swagger-ui.path      = /swagger-ui.html
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.tagsSorter       = alpha
