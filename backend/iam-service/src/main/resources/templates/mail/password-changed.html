<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{mail/_layout :: page(
        'Your password was changed',
        'A confirmation, and what to do if it was not you.',
        ~{::content})}">
<content th:fragment="content">
    <p style="margin:0 0 14px 0;">Hello <span th:text="${firstName}">there</span>,</p>
    <p style="margin:0 0 14px 0;">
        The password for <span th:text="${email}" style="color:#08172c;">your account</span> has just been changed,
        and every other signed-in session has been ended.
    </p>
    <p style="margin:0;padding:14px 16px;background-color:#fdf3e6;border-left:3px solid #d97012;border-radius:8px;font-size:14px;color:#a9560a;">
        If this was not you, reset your password immediately and tell your administrator.
    </p>
</content>
</body>
</html>
