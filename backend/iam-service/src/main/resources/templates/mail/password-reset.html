<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{mail/_layout :: page(
        'Reset your password',
        'A link to choose a new password.',
        ~{::content})}">
<content th:fragment="content">
    <p style="margin:0 0 14px 0;">Hello <span th:text="${firstName}">there</span>,</p>
    <p style="margin:0;">
        Someone asked to reset the password for this account. If that was you, choose a new one now.
    </p>

    <div th:replace="~{mail/_layout :: button('Choose a new password', ${resetLink})}"></div>

    <p style="margin:0 0 14px 0;font-size:13px;color:#7e8ea6;">
        The link works for <span th:text="${validForMinutes}">60</span> minutes and can be used once.
        If you did not ask for this, ignore this message: nothing changes until the link is opened.
    </p>

    <div th:replace="~{mail/_layout :: fallback(${resetLink})}"></div>
</content>
</body>
</html>
