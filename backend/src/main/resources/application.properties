spring.config.import = optional:file:.env[.properties]

spring.datasource.url = jdbc:sqlite:${DB_PATH:bimap.db}?foreign_keys=true&journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
spring.datasource.hikari.maximum-pool-size = 1

spring.jpa.hibernate.ddl-auto = none
spring.jpa.open-in-view = false

jwt.secret = ${JWT_SECRET}

app.frontend-url = ${APP_FRONTEND_URL:http://localhost:4200}
app.security.content-security-policy = ${CONTENT_SECURITY_POLICY:default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'}

spring.mail.host = ${MAIL_HOST}
spring.mail.port = ${MAIL_PORT}
spring.mail.username = ${MAIL_USERNAME}
spring.mail.password = ${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.properties.mail.smtp.connectiontimeout = 5000
spring.mail.properties.mail.smtp.timeout = 5000
spring.mail.properties.mail.smtp.writetimeout = 5000
app.mail.from = ${MAIL_FROM}

springdoc.api-docs.enabled = ${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled = ${API_DOCS_ENABLED:true}

info.app.name = @project.name@
info.app.description = @project.description@
info.app.version = @project.version@

management.endpoints.web.exposure.include = health,info
management.endpoint.health.probes.enabled = true
management.endpoint.health.show-details = when-authorized
management.endpoint.health.roles = ADMINISTRATOR
management.health.mail.enabled = false
management.info.env.enabled = true
