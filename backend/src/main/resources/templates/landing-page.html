<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${name}">BiMap</title>
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #2563eb;
            --up: #16a34a;
            --down: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: #f8fafc;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        h1 {
            font-size: 28px;
        }

        .status {
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            color: #fff;
            background: var(--down);
        }

        .status.up {
            background: var(--up);
        }

        .description {
            color: var(--muted);
            margin: 12px 0 32px;
            line-height: 1.5;
        }

        dl {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 24px 0;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        dt {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        dd {
            font-weight: 600;
            margin-top: 4px;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 32px;
        }

        nav a {
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            color: var(--ink);
            font-weight: 600;
        }

        nav a:first-child {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        nav a:hover {
            border-color: var(--accent);
        }

        footer {
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
            text-align: center;
        }

        footer a {
            color: var(--muted);
        }

        @media (max-width: 520px) {
            main {
                padding: 24px;
            }

            nav, dl {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1 th:text="${name}">BiMap</h1>
        <span class="status" th:classappend="${status == 'UP'} ? 'up'" th:text="${status}">UP</span>
    </header>
    <p class="description" th:text="${description}">Register Italian heritage assets on a map</p>
    <dl>
        <div>
            <dt>Version</dt>
            <dd th:text="${version}">1.0.0</dd>
        </div>
        <div>
            <dt>Uptime</dt>
            <dd th:text="${uptime}">0d 0h 0m</dd>
        </div>
        <div>
            <dt>Java</dt>
            <dd th:text="${javaVersion}">27</dd>
        </div>
        <div>
            <dt>Spring Boot</dt>
            <dd th:text="${springBootVersion}">4.1.1</dd>
        </div>
    </dl>
    <nav>
        <a href="/swagger-ui.html">API docs</a>
        <a href="https://krishnapilato.github.io/bimap/">Frontend</a>
        <a href="https://github.com/krishnapilato/bimap">Source code</a>
    </nav>
    <footer>
        <a href="/actuator/health">Health</a> · <a href="/actuator/info">Info</a>
    </footer>
</main>
</body>
</html>
