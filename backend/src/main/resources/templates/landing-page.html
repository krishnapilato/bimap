<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" th:content="${description}" content="Register Italian heritage assets on a map.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" as="image" type="image/webp" href="/images/italy.webp" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
    <title th:text="${name}">BiMap</title>
    <style>
        :root {
            --ink: #18181b;
            --muted: rgb(24 24 27 / 0.7);
            --soft: #f4f4f5;
            --line: #e4e4e7;
            --up: #16a34a;
            --down: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Geist, ui-sans-serif, system-ui, sans-serif;
            color: var(--ink);
            background: #fff;
        }

        main {
            display: grid;
            min-height: 100dvh;
        }

        .map {
            order: -1;
            height: 40svh;
            min-height: 10rem;
            max-height: 28rem;
            background: var(--soft) url("/images/italy.webp") center / cover;
            mask-image: linear-gradient(to bottom, #000 50%, transparent);
        }

        .content {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: -4rem;
            padding: 0 1.5rem 3rem;
        }

        .badge {
            align-self: flex-start;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: var(--soft);
            font-size: 0.875rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.025em;
            text-wrap: balance;
        }

        p {
            max-width: 28rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        nav a {
            padding: 0.625rem 0.875rem;
            border-radius: 0.625rem;
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
        }

        nav a:first-child {
            background: var(--ink);
            color: #fff;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.15);
        }

        nav a:not(:first-child):hover {
            background: var(--soft);
        }

        .status {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.875rem;
        }

        .status a {
            color: inherit;
        }

        .dot {
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            margin-right: 0.375rem;
            border-radius: 50%;
            background: var(--down);
        }

        .dot.up {
            background: var(--up);
        }

        @media (min-width: 640px) {
            .content {
                padding: 0 3rem 3rem;
            }

            h1 {
                font-size: 3rem;
            }

            p {
                font-size: 1.125rem;
            }

            nav a {
                padding: 0.75rem 1.25rem;
                font-size: 1.125rem;
            }
        }

        @media (min-width: 1024px) {
            main {
                grid-template-columns: 1fr 1fr;
            }

            .map {
                order: 0;
                height: auto;
                max-height: none;
                mask-image: linear-gradient(to right, transparent, #000 50%);
            }

            .content {
                justify-content: center;
                margin-top: 0;
                padding: 3rem 4rem;
            }
        }

        @media (min-width: 1280px) {
            .content {
                padding: 3rem 6rem;
            }

            h1 {
                font-size: 4.5rem;
            }
        }
    </style>
</head>
<body style="margin: 0; user-select: none;" oncontextmenu="return false;">
<main>
    <section class="content">
        <span class="badge" th:text="${name}">BiMap</span>
        <h1>Powering Italy's heritage map.</h1>
        <p th:text="${description}">Register Italian heritage assets on a map.</p>
        <nav>
            <a href="/swagger-ui.html">API docs</a>
            <a href="https://krishnapilato.github.io/bimap/">Frontend</a>
            <a href="https://github.com/krishnapilato/bimap">Source code</a>
        </nav>
        <div class="status">
            <span><span class="dot" th:classappend="${status == 'UP'} ? 'up'"></span><span th:text="${status}">UP</span></span>
            <span th:text="|Version ${version}|">Version 1.0.0</span>
            <span th:text="|Java ${javaVersion} · Spring Boot ${springBootVersion}|">Java 27 · Spring Boot 4.1.2</span>
            <span th:text="|Up ${uptime}|">Up 0d 0h 0m</span>
            <a href="/actuator/health">Health</a>
            <a href="/actuator/info">Info</a>
        </div>
    </section>
    <section class="map" aria-hidden="true"></section>
</main>
</body>
</html>
