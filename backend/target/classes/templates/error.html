<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Backend Service</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/565/565504.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>

<body class="h-screen w-screen flex items-center justify-center overflow-hidden select-none" oncontextmenu="return false;">

<div class="relative w-[90vw] h-[90vh] rounded-3xl overflow-hidden shadow-2xl">

    <div id="map-background" class="absolute inset-0 z-10"></div>

    <div class="absolute inset-0 z-20 flex items-center justify-center bg-black/5 p-4">
        <div class="w-full max-w-[900px] rounded-3xl border border-white/60 bg-white/85 p-8 md:p-14 text-center backdrop-blur-xl shadow-[0_0_60px_20px_rgba(255,255,255,0.9),0_15px_50px_rgba(14,165,233,0.15)] transition-transform duration-300 hover:-translate-y-0.5">

            <h6 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-br from-slate-900 to-slate-700 bg-clip-text text-transparent">
                Endpoint Not Found
            </h6>

            <p class="mt-3 text-base md:text-lg text-slate-500">
                The requested endpoint does not exist.<br>
                Redirecting to <span class="font-semibold text-slate-700">landing page</span> in <span id="countdown" class="font-bold text-sky-600">10</span> seconds...
            </p>

            <div class="mt-10 flex flex-wrap justify-center gap-4">
                <a href="/"
                   class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-br from-sky-500 to-blue-600 px-5 py-3 font-medium text-white shadow-md shadow-blue-500/25 transition-all duration-250 hover:-translate-y-1 hover:shadow-lg hover:shadow-blue-500/40">
                    <i class="bi bi-house-door-fill"></i> Go Home Now
                </a>

                <a href="http://localhost:4200" target="_blank"
                   class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-3 font-medium text-slate-600 shadow-sm transition-all duration-250 hover:-translate-y-1 hover:border-slate-300 hover:text-slate-900 hover:shadow-md">
                    <i class="bi bi-box-arrow-in-right"></i> Open App
                </a>

                <a href="/swagger-ui/index.html"
                   class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-3 font-medium text-slate-600 shadow-sm transition-all duration-250 hover:-translate-y-1 hover:border-slate-300 hover:text-slate-900 hover:shadow-md">
                    <i class="bi bi-journal-code"></i> Swagger API
                </a>
            </div>

            <div class="mt-10 text-xs md:text-sm font-semibold tracking-wide text-slate-500">
                Spring Boot 4.2-M1 • Java 26 • MySQL 26.7 • REST APIs
            </div>
        </div>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map-background', { zoomControl: false, attributionControl: false }).setView([46.2044, 6.1432], 5);

    L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 21, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], noWrap: true
    }).addTo(map);

    const locations = [
        [41.9028, 12.4964, 11], [45.4642, 9.1900, 11], [45.4408, 12.3155, 12],
        [43.7696, 11.2558, 12], [40.8518, 14.2681, 11], [38.1157, 13.3615, 11],
        [45.0703, 7.6869, 11],  [44.4949, 11.3426, 12]
    ];

    setInterval(() => {
        const [lat, lng, zoom] = locations[Math.floor(Math.random() * locations.length)];
        map.flyTo([lat, lng], zoom, { duration: 5.0 });
    }, 10000);

    let timeLeft = 10;
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(() => {
        timeLeft--;
        if (countdownEl) countdownEl.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            window.location.href = '/';
        }
    }, 1000);
</script>

</body>
</html>
