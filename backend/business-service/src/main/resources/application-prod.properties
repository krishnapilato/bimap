#
# Production hardening. Everything here is a deliberate narrowing of the defaults.
#

# The API contract is published with the release, not served from the running system.
springdoc.api-docs.enabled   = false
springdoc.swagger-ui.enabled = false

# Never hand an internal detail to an unauthenticated caller.
server.error.include-message    = never
server.error.include-stacktrace = never
server.error.include-binding-errors = never

# Only what an operator or a probe legitimately needs.
management.endpoints.web.exposure.include = health,info,metrics,prometheus
management.endpoint.health.show-details   = when_authorized
management.endpoint.health.show-components = when_authorized

# Do not advertise the server, and cap the request line to blunt trivial abuse.
server.tomcat.max-http-form-post-size = 256KB
server.max-http-request-header-size   = 16KB

spring.jpa.show-sql = false
