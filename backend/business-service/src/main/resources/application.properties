#
# BiMap Business Core Service
#
# Every secret is read from the environment. Nothing sensitive is committed; the defaults here
# are safe placeholders for a local run and are overridden in every real deployment.
#

# ---------------------------------------------------------------------------
# Local secrets
#
# Reads the .env at the repository root, so one file serves Docker and a local run alike.
# Optional and searched from three depths, because the working directory differs between
# running from the repo root, from backend/, and from the module directory in an IDE.
# Real environment variables always win over anything found here.
# ---------------------------------------------------------------------------
spring.config.import = optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.application.name           = bimap-business-service
server.port                       = ${BUSINESS_SERVER_PORT:9844}
server.shutdown                   = graceful
server.compression.enabled        = true
server.compression.mime-types     = application/json,application/problem+json,text/csv,text/html,text/css,application/javascript
server.error.include-message      = always
server.error.include-stacktrace   = never
server.error.whitelabel.enabled   = false

spring.threads.virtual.enabled    = true
spring.mvc.problemdetails.enabled = true
spring.lifecycle.timeout-per-shutdown-phase = 20s
spring.jackson.default-property-inclusion   = non_null
# Jackson 3 already writes temporals as ISO-8601 strings, so nothing to configure here.

# ---------------------------------------------------------------------------
# Landing page and CORS
# ---------------------------------------------------------------------------
bimap.platform.service-name   = Business Core Service
bimap.platform.tagline        = Asset registrations and Italian geographic lookups
bimap.platform.app-url        = ${BIMAP_APP_URL:http://localhost:4200}
bimap.platform.repository-url = https://github.com/krishnapilato/bimap
bimap.platform.cors-origins   = ${BIMAP_CORS_ORIGINS:http://localhost:4200}

# The sibling service, linked from the landing page so its API is one click away rather than a
# port number an operator has to remember.
bimap.platform.peers[0].name = IAM
bimap.platform.peers[0].url  = ${IAM_SERVICE_URL:http://localhost:9843}
bimap.platform.peers[0].owns = Sign-in, registration, password recovery, the user directory


# ---------------------------------------------------------------------------
# Credits
#
# The public APIs this service reads from, shown on the landing page and in the OpenAPI
# document. None of the geography here is ours; these projects made it available.
# ---------------------------------------------------------------------------
bimap.platform.attributions[0].name     = Comuni-ITA
bimap.platform.attributions[0].url      = https://github.com/Samurai016/Comuni-ITA
bimap.platform.attributions[0].provides = Italian regions, provinces, municipalities, ISTAT and cadastral codes
bimap.platform.attributions[0].licence  = MIT

bimap.platform.attributions[1].name     = Nominatim (OpenStreetMap)
bimap.platform.attributions[1].url      = https://nominatim.openstreetmap.org/ui/search.html
bimap.platform.attributions[1].provides = Address resolution, postcodes and coordinates
bimap.platform.attributions[1].licence  = ODbL 1.0

bimap.platform.attributions[2].name     = codiceunivoco.it
bimap.platform.attributions[2].url      = https://codiceunivoco.it
bimap.platform.attributions[2].provides = Italian public-body directory and electronic invoicing codes
bimap.platform.attributions[2].licence  = Public data

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
spring.datasource.url      = jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bimap_core}?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username = ${DB_USERNAME:bimap}
spring.datasource.password = ${DB_PASSWORD:}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name          = bimap-core-pool
spring.datasource.hikari.maximum-pool-size  = ${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle       = 2
spring.datasource.hikari.connection-timeout = 20000
spring.datasource.hikari.max-lifetime       = 1200000

spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view       = false
spring.jpa.properties.hibernate.jdbc.batch_size = 50
spring.jpa.properties.hibernate.order_inserts   = true
spring.jpa.properties.hibernate.order_updates   = true
spring.jpa.properties.hibernate.jdbc.time_zone  = UTC
# Keeps the CSV export from materialising the whole table in heap.
spring.jpa.properties.hibernate.jdbc.fetch_size = 200

spring.flyway.enabled             = true
spring.flyway.locations           = classpath:db/migration
spring.flyway.baseline-on-migrate = true

# ---------------------------------------------------------------------------
# Tokens
#
# The same signing key as the IAM service. This service only verifies; it never issues.
# ---------------------------------------------------------------------------
bimap.security.jwt.secret = ${BIMAP_JWT_SECRET:development-only-secret-please-replace-me-in-every-real-deployment}
bimap.security.jwt.issuer = ${BIMAP_JWT_ISSUER:bimap}

# ---------------------------------------------------------------------------
# Upstream APIs
#
# None of them offers server-side search, so answers are cached and the filtering happens here.
# Set a cache-ttl to 0s to send every request straight through to the source.
# ---------------------------------------------------------------------------
bimap.integration.user-agent = ${INTEGRATION_USER_AGENT:BiMap/2.0 (https://github.com/krishnapilato/bimap)}
bimap.integration.warm-up-interval = PT6H

bimap.integration.comuni-ita.base-url        = ${COMUNI_ITA_URL:https://comuni-ita.nicolorebaioli.dev}
bimap.integration.comuni-ita.connect-timeout = 3s
bimap.integration.comuni-ita.read-timeout    = 20s
bimap.integration.comuni-ita.cache-ttl       = ${COMUNI_ITA_CACHE_TTL:24h}

bimap.integration.nominatim.base-url        = ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
bimap.integration.nominatim.connect-timeout = 3s
bimap.integration.nominatim.read-timeout    = 10s
bimap.integration.nominatim.cache-ttl       = ${NOMINATIM_CACHE_TTL:12h}

bimap.integration.codice-univoco.base-url        = ${CODICE_UNIVOCO_URL:https://codiceunivoco.it}
bimap.integration.codice-univoco.connect-timeout = 3s
bimap.integration.codice-univoco.read-timeout    = 10s
bimap.integration.codice-univoco.cache-ttl       = ${CODICE_UNIVOCO_CACHE_TTL:12h}


# Authentication is stateless and token-based, so the default in-memory user (and the generated
# password it prints at every start) is dead weight.
spring.autoconfigure.exclude = org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Readiness decides whether a load balancer sends traffic here. The database belongs in that
# decision; a temporarily unreachable SMTP relay does not, because the API still works without it.
management.endpoint.health.group.readiness.include = readinessState,db
management.endpoint.health.group.liveness.include  = livenessState

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include = health,info,metrics,caches,loggers,env,mappings
management.endpoint.health.show-details   = when_authorized
management.endpoint.health.probes.enabled = true
management.observations.key-values.service = bimap-business-service
management.metrics.distribution.percentiles-histogram.http.server.requests = true

springdoc.api-docs.path   = /v3/api-docs
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.tagsSorter       = alpha
