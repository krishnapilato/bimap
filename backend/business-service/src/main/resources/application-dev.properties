#
# Local development. Never active in a deployed environment.
#

# Convenient locally, deliberately absent from the base configuration where the schema is
# created by an operator rather than by the application.
spring.datasource.url = jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bimap_core}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true

spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql = true



# Everything visible while developing.
management.endpoints.web.exposure.include = *
management.endpoint.health.show-details   = always

springdoc.swagger-ui.tryItOutEnabled = true
