<a class="bm-skip-link" href="#bm-main">Skip to main content</a>

<!--
  The bar carries identity and exit, and nothing else. Everything that was
  competing with the page for attention up here — a clock, a command trigger,
  a spelled-out user card — has either moved into the work itself or been
  reduced to the smallest thing that still answers its question.
-->
<header class="shell-bar" #shellBar>
  <a class="shell-brand" routerLink="/main" aria-label="BiMap workspace">
    <span class="bm-benchmark" aria-hidden="true"></span>
    <span class="shell-brand-copy">
      <strong>BiMap</strong>
      @if (section()) {
        <small>{{ section() }}</small>
      }
    </span>
  </a>

  <div class="shell-rail">
    @if (isAdmin()) {
      <a
        class="shell-icon"
        routerLink="/listuser"
        routerLinkActive="is-current"
        matTooltip="User administration"
        aria-label="User administration"
      >
        <mat-icon>manage_accounts</mat-icon>
      </a>
    }

    @if (user()) {
      <!-- The avatar answers "who am I signed in as" at a glance; the full
           name and role are one hover away rather than always on screen. -->
      <span class="identity" [matTooltip]="identityTooltip()" [attr.aria-label]="identityTooltip()">
        {{ initials() }}
      </span>
    }

    <a
      class="shell-icon shell-icon--danger"
      routerLink="/logout"
      matTooltip="Sign out"
      aria-label="Sign out"
    >
      <mat-icon>logout</mat-icon>
    </a>
  </div>
</header>

<main
  id="bm-main"
  class="shell-main"
  [class.shell-main--wide]="wide()"
  [class.shell-main--flush]="flush()"
  tabindex="-1"
>
  <ng-content />
</main>
