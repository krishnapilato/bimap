<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BiMap</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="BiMap is the field instrument for Italian cadastral and heritage asset registration: a guided survey on a live map with Street View, the registry behind it, and the people and mailing lists that run it."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      /* The first paint, before Angular boots: the mark breathing on the canvas colour. */
      html, body { margin: 0; background: #f3f5f8; }
      .bm-boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .bm-boot svg { width: 44px; height: 44px; animation: bm-boot 1.6s cubic-bezier(.4, 0, .2, 1) infinite; }
      @keyframes bm-boot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.92); opacity: .72; } }
      @media (prefers-reduced-motion: reduce) { .bm-boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <bm-root>
      <div class="bm-boot" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <rect width="32" height="32" rx="9" fill="#1257e6" />
          <circle cx="16" cy="16" r="7.25" fill="none" stroke="#fff" stroke-width="2" />
          <path d="M16 5.5v4M16 22.5v4M5.5 16h4M22.5 16h4" stroke="#fff" stroke-width="2" stroke-linecap="round" />
          <circle cx="16" cy="16" r="2.6" fill="#ff9a3d" />
        </svg>
      </div>
    </bm-root>
  </body>
</html>
