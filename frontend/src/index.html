<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.googleusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8080 https://comuni-ita.nicolorebaioli.dev https://nominatim.openstreetmap.org https://*.google.com https://*.googleapis.com https://*.gstatic.com data: blob:; frame-src https://*.google.com; worker-src blob:; media-src 'none'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>BiMap</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Register Italian heritage assets on a map: find a place, check it in Street View and save its details."
    />
    <meta name="theme-color" content="#18181b" />
    <meta property="og:title" content="BiMap" />
    <meta property="og:description" content="Register Italian heritage assets on a map." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      document.addEventListener('contextmenu', (event) => event.preventDefault());
      const route = location.hash
        ? location.hash.slice(1)
        : location.pathname.slice(new URL(document.baseURI).pathname.length - 1);
      if (route === '/' || route.startsWith('/login')) {
        document.head.append(
          Object.assign(document.createElement('link'), {
            rel: 'preload',
            as: 'image',
            type: 'image/webp',
            href: 'italy-960.webp',
            imageSrcset: 'italy-640.webp 640w, italy-960.webp 960w, italy-1280.webp 1280w',
            imageSizes: '(min-width: 1024px) 50vw, 100vw',
            fetchPriority: 'high',
          }),
        );
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
