# BiMap frontend — nginx.
#
# Serves the Angular bundle and reverse-proxies both services, so the browser only ever talks to one
# origin. Same-origin is not cosmetic: there is no CORS preflight on every call, and it is why the
# production environment points at /iam and /core rather than at two ports.
#
# TLS is not terminated here. In front of anything public, put this behind a proxy or load balancer
# that serves HTTPS, and turn on the Strict-Transport-Security line below once it does.
#
# Author: Khova Krishna Pilato

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The locate button needs geolocation; nothing needs the camera, microphone or payment.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # Google sign-in opens a popup that must be able to report back.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Report-only until it has been watched against real Google Maps and sign-in traffic: a policy
    # that is one host short would break the map, which is the one thing this app cannot lose.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://maps.googleapis.com https://*.google.com https://accounts.google.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Hashed filenames can be cached for a year; index.html never, or a deploy would not land.
    # `expires` rather than `add_header`: an add_header inside a location silently drops every
    # security header declared above for that location.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── The two services, behind one origin ───────────────────────────────────
    location /iam/ {
        proxy_pass http://iam-service:9843/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One browser action stays traceable across both services and the logs of each.
        proxy_set_header X-Correlation-Id $request_id;
        proxy_read_timeout 30s;
        # A message may carry ten attachments, sent base64-encoded inside the JSON body.
        client_max_body_size 16m;
    }

    location /core/ {
        proxy_pass http://business-service:9844/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        # Geography lookups call public registries upstream, so allow for a slow one.
        proxy_read_timeout 45s;
    }

    # Angular owns routing: an unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
