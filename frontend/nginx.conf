# BiMap frontend — nginx.
#
# Serves the Angular bundle and reverse-proxies the two backend services, so the browser only ever
# talks to one origin. That is not cosmetic: same-origin means no CORS preflight on every API call
# and no third-party cookie problem, and it is why the production environment points at /iam and
# /core rather than at two ports.
#
# Author: Khova Krishna Pilato

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version we are running.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed filenames can be cached forever; index.html never can, or a deploy would not land.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── The two services, behind one origin ─────────────────────────────────
    location /iam/ {
        proxy_pass http://iam-service:9843/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Passed through so one browser action stays traceable across both services.
        proxy_set_header X-Correlation-Id $request_id;
        proxy_read_timeout 30s;
    }

    location /core/ {
        proxy_pass http://business-service:9844/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        # The geography lookups call three upstream registries, so allow for a slow one.
        proxy_read_timeout 45s;
    }

    # Angular owns routing: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
